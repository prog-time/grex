version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  # Bumps the exact pins in requirements-ci.txt (what CI installs) and the
  # ranges in requirements.txt / requirements-dev.txt when a release falls
  # outside them. Each bump is its own PR, so CI shows whether it is safe.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
