name: 📝 Документация
description: Сообщить о проблеме в документации или предложить улучшение
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Нашли неточность или пробел в документации? Расскажите, где и что.
  - type: input
    id: location
    attributes:
      label: Где
      description: Файл, страница или раздел документации.
      placeholder: README.md → раздел «Установка»
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: В чём проблема
      description: Что не так — ошибка, устаревшая информация, чего-то не хватает?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Предложение
      description: Как стоит исправить или дополнить?
    validations:
      required: false
