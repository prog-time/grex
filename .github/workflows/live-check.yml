name: Live check

# Parses one reference product per marketplace on the live sites (see
# scripts/live_check.py). Does not run on PRs: marketplaces change without
# notice, so this tells when a crawler broke, not whether a PR is good.
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC = 06:00 MSK
  workflow_dispatch:
    inputs:
      only:
        description: "Marketplaces to check, space-separated (empty = all)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    name: Live check (crawlers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          patchright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Prepare config
        env:
          # Russian proxies, one per line (login:password@host:port). Ozon and
          # several other marketplaces refuse non-Russian IPs.
          GREX_PROXY: ${{ secrets.GREX_PROXY }}
          GREX_PROXY_TYPE: ${{ vars.GREX_PROXY_TYPE || 'http' }}
        run: |
          cp data/settings.yml.example data/settings.yml
          if [ -n "$GREX_PROXY" ]; then
            printf '%s\n' "$GREX_PROXY" > data/proxy.txt
            python - <<'PY'
          import os
          import re
          path = "data/settings.yml"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"^(proxy:\n\s+active:\s*).*$", r"\1true", text, count=1, flags=re.M)
          text = re.sub(r'^(\s+type:\s*)"http"$', lambda m: f'{m.group(1)}"{os.environ["GREX_PROXY_TYPE"]}"',
                        text, count=1, flags=re.M)
          open(path, "w", encoding="utf-8").write(text)
          PY
            echo "Proxy enabled"
          else
            echo "::warning::GREX_PROXY secret is not set — marketplaces that require a Russian IP will fail"
          fi
      - name: Run live check
        id: check
        env:
          ONLY: ${{ inputs.only }}
        # $ONLY is unquoted on purpose: a space-separated list of marketplaces
        run: xvfb-run --auto-servernum python scripts/live_check.py --report report.md ${ONLY:+--only $ONLY}
      - name: Job summary
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Open or update the failure issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Live check: crawlers failing"
          { echo "Ночная проверка парсеров на живых сайтах нашла ошибки ($RUN_URL)."; echo; cat report.md; } > body.md
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label bug
          fi
