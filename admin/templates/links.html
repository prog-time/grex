{% extends "layout.html" %}

{% block header %}
<div class="d-flex justify-content-between align-items-center">
  <h1>Link Extractor</h1>
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for(__name__ ~ ':index') }}">Admin</a></li>
    <li class="breadcrumb-item active">Link Extractor</li>
  </ol>
</div>
{% endblock %}

{% block content %}
<div class="container-xl">

  <!-- ── Form ────────────────────────────────────────────────────────── -->
  <div class="card mb-3">
    <div class="card-header"><h3 class="card-title">Source</h3></div>
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-8">
          <label class="form-label">Seller or catalog URL <span class="text-danger">*</span></label>
          <input id="lUrl" type="url" class="form-control"
                 placeholder="https://www.wildberries.ru/seller/123456 or https://ozon.ru/seller/apple/products/">
          <div class="form-hint">Marketplace is detected automatically. Seller pages, catalogs and search pages are supported.</div>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Max pages</label>
          <input id="lMaxPages" type="number" class="form-control" value="10" min="1" max="50">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">&nbsp;</label>
          <button type="button" class="btn btn-primary w-100" id="btnExtract" onclick="startExtraction()">
            Extract
          </button>
        </div>
      </div>
      <div id="lError" class="alert alert-danger mb-0" style="display:none;"></div>
    </div>
  </div>

  <!-- ── Progress ──────────────────────────────────────────────────────── -->
  <div id="progressCard" class="card mb-3" style="display:none;">
    <div class="card-body text-center py-4">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <div class="text-muted" id="progressText">Loading pages…</div>
    </div>
  </div>

  <!-- ── Results ───────────────────────────────────────────────────── -->
  <div id="resultsCard" class="card" style="display:none;">
    <div class="card-header">
      <h3 class="card-title" id="resultsTitle">Results</h3>
      <div class="card-options d-flex align-items-center gap-2">
        <span class="badge bg-azure text-white" id="resultsBadge"></span>
        <select class="form-select form-select-sm w-auto" id="linksPerPage" onchange="setLinksPerPage(this.value)">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
        </select>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="downloadCSV()">
          <i class="fa fa-download me-1"></i>CSV
        </button>
        <button type="button" class="btn btn-sm btn-outline-success" onclick="downloadExcel()">
          <i class="fa fa-file-excel-o me-1"></i>Excel
        </button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-vcenter table-sm card-table">
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>Product URL</th>
          </tr>
        </thead>
        <tbody id="linksBody"></tbody>
      </table>
    </div>
    <div class="card-footer d-flex align-items-center" id="linksPager"></div>
  </div>
</div>

<script>
var _extractedLinks = [];
var _extractedMarketplace = '';
var _extractedUrl = '';
var _linksPage = 1;
var _linksPerPage = 50;

// ── Start extraction ────────────────────────────────────────────────────

async function startExtraction() {
  var url       = document.getElementById('lUrl').value.trim();
  var maxPages  = parseInt(document.getElementById('lMaxPages').value) || 10;
  var errEl     = document.getElementById('lError');
  var btn       = document.getElementById('btnExtract');

  errEl.style.display = 'none';
  if (!url) { showError('Please enter a URL.'); return; }

  btn.disabled = true;
  btn.textContent = '…';
  document.getElementById('progressCard').style.display = '';
  document.getElementById('resultsCard').style.display = 'none';
  document.getElementById('progressText').textContent = 'Loading pages…';

  try {
    var res  = await fetch('/admin/links/extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url, max_pages: maxPages}),
    });
    var data = await res.json();

    if (!res.ok || !data.ok) {
      showError(data.error || ('HTTP ' + res.status));
      return;
    }

    _extractedLinks       = data.links || [];
    _extractedMarketplace = data.marketplace || '';
    _extractedUrl         = data.url || url;
    _linksPage = 1;

    renderResults();

  } catch(e) {
    showError(String(e));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract';
    document.getElementById('progressCard').style.display = 'none';
  }
}

// ── Render table ─────────────────────────────────────────────────────

function setLinksPerPage(val) {
  _linksPerPage = parseInt(val) || 50;
  _linksPage = 1;
  renderResults();
}

function goToLinkPage(p) {
  var totalPages = Math.max(1, Math.ceil(_extractedLinks.length / _linksPerPage));
  _linksPage = Math.max(1, Math.min(p, totalPages));
  renderResults();
}

function renderResults() {
  var links = _extractedLinks;
  var total = links.length;
  var totalPages = Math.max(1, Math.ceil(total / _linksPerPage));
  var start = (_linksPage - 1) * _linksPerPage;
  var page  = links.slice(start, start + _linksPerPage);

  var card  = document.getElementById('resultsCard');
  var title = document.getElementById('resultsTitle');
  var badge = document.getElementById('resultsBadge');
  var tbody = document.getElementById('linksBody');

  title.textContent = 'Extracted links — ' + esc(_extractedMarketplace);
  badge.textContent = total + ' links';

  if (!page.length) {
    tbody.innerHTML = '<tr><td colspan="2" class="text-muted text-center py-3">No links found.</td></tr>';
    document.getElementById('linksPager').innerHTML = '';
  } else {
    tbody.innerHTML = page.map(function(link, i) {
      return '<tr>'
        + '<td class="text-muted">' + (start + i + 1) + '</td>'
        + '<td><a href="' + esc(link) + '" target="_blank" class="text-truncate d-block" '
        + 'style="max-width:700px" title="' + esc(link) + '">' + esc(link) + '</a></td>'
        + '</tr>';
    }).join('');

    var from = total ? start + 1 : 0;
    var to   = Math.min(start + _linksPerPage, total);
    document.getElementById('linksPager').innerHTML =
      '<p class="m-0 text-secondary">Showing ' + from + '–' + to + ' of ' + total + '</p>'
      + buildPagination(_linksPage, totalPages, 'goToLinkPage');
  }

  card.style.display = '';
}

function buildPagination(current, totalPages, goFn) {
  if (totalPages <= 1) return '';
  var items = [];
  var s = Math.max(1, current - 2), e = Math.min(totalPages, current + 2);
  if (s > 1) { items.push(1); if (s > 2) items.push('…'); }
  for (var i = s; i <= e; i++) items.push(i);
  if (e < totalPages) { if (e < totalPages - 1) items.push('…'); items.push(totalPages); }
  var html = '<ul class="pagination m-0 ms-auto">';
  html += '<li class="page-item' + (current === 1 ? ' disabled' : '') + '">'
    + '<a class="page-link" href="#" onclick="' + goFn + '(' + (current - 1) + ');return false;">‹</a></li>';
  items.forEach(function(p) {
    if (p === '…') {
      html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
    } else {
      html += '<li class="page-item' + (p === current ? ' active' : '') + '">'
        + '<a class="page-link" href="#" onclick="' + goFn + '(' + p + ');return false;">' + p + '</a></li>';
    }
  });
  html += '<li class="page-item' + (current === totalPages ? ' disabled' : '') + '">'
    + '<a class="page-link" href="#" onclick="' + goFn + '(' + (current + 1) + ');return false;">›</a></li>';
  return html + '</ul>';
}

// ── Download CSV ────────────────────────────────────────────────────────

async function downloadCSV() {
  if (!_extractedLinks.length) return;
  var res = await fetch('/admin/links/download-csv', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({links: _extractedLinks, marketplace: _extractedMarketplace}),
  });
  if (!res.ok) return;
  var blob = await res.blob();
  triggerDownload(blob, 'links_' + _extractedMarketplace + '_' + dateSuffix() + '.csv');
}

// ── Download Excel ──────────────────────────────────────────────────────

async function downloadExcel() {
  if (!_extractedLinks.length) return;
  var res = await fetch('/admin/links/download-excel', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({links: _extractedLinks, marketplace: _extractedMarketplace}),
  });
  if (!res.ok) return;
  var blob = await res.blob();
  triggerDownload(blob, 'links_' + _extractedMarketplace + '_' + dateSuffix() + '.xlsx');
}

// ── Helpers ────────────────────────────────────────────────────

function triggerDownload(blob, filename) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function dateSuffix() {
  var d = new Date();
  return d.toISOString().slice(0, 10).replace(/-/g, '');
}

function showError(msg) {
  var el = document.getElementById('lError');
  el.textContent = msg;
  el.style.display = '';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
